[workspace]
resolver = "2"
members = [
  "rust-script",
  "derive",
  "integration-test"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
godot = { version = "0.5.2", features = ["experimental-threads"] }
godot-cell = "0.5.2"
godot-bindings = "0.5.2"
itertools = "0.10"
rand = "0.9"
darling = { version = "0.20" }
proc-macro2 = "1.0"
quote = "1"
syn = "2"
const-str = "0.5"
thiserror = "1"

godot-rust-script-derive = { path = "derive" }
tests-scripts-lib = { path = "tests-scripts-lib" }

[patch.crates-io]
godot = { git = 'https://github.com/godot-rust/gdext.git', rev = "1f3e4aee10002a35a68e5d2007f49ef1d4385bd8" }

